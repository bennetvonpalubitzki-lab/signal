# =====================================================================
#  SIGNAL — Konfiguration
#  Alles, was du regelmaessig anpassen willst, steht in dieser Datei.
#  Am Code selbst musst du nichts aendern.
# =====================================================================

dashboard_url: "https://DEIN-BENUTZERNAME.github.io/signal/"

# --- Watchlist -------------------------------------------------------
# Diese Werte bekommen ein anklickbares Profil im Dashboard und loesen
# Alarme aus. yfinance-Schreibweise: .DE fuer XETRA, .PA fuer Paris,
# .AS fuer Amsterdam, ohne Suffix fuer US-Boersen.
watchlist:
  - ENR.DE      # Siemens Energy
  - RHM.DE      # Rheinmetall
  - ASML.AS     # ASML
  - SU.PA       # Schneider Electric
  - GEV         # GE Vernova
  - CCJ         # Cameco
  - FCX         # Freeport-McMoRan
  - NVDA

# --- Themen, die dich interessieren ----------------------------------
# Meldungen mit diesen Begriffen werden im Ranking hochgestuft.
themen:
  - zinskurve
  - notenbank
  - inflation
  - carry trade
  - kupfer
  - uran
  - erdgas
  - netzausbau
  - rechenzentrum
  - halbleiter
  - ruestung
  - staatsanleihen

# Wie aehnlich muessen zwei Meldungen sein, um als dieselbe zu gelten?
# Niedriger = strenger (mehr Cluster), hoeher = grosszuegiger.
cluster_schwelle: 0.70

# --- Nachrichtenquellen ----------------------------------------------
# region: us | eu | dach | global   —  gewicht: 1 (normal) bis 3 (hoch)
feeds:
  - {name: "Tagesschau Wirtschaft", url: "https://www.tagesschau.de/wirtschaft/index~rss2.xml", region: dach, gewicht: 2}
  - {name: "Handelsblatt Finanzen", url: "https://www.handelsblatt.com/contentexport/feed/finanzen", region: dach, gewicht: 3}
  - {name: "SPIEGEL Wirtschaft",    url: "https://www.spiegel.de/wirtschaft/index.rss", region: dach, gewicht: 2}
  - {name: "FAZ Wirtschaft",        url: "https://www.faz.net/rss/aktuell/wirtschaft/", region: dach, gewicht: 2}
  - {name: "manager magazin",       url: "https://www.manager-magazin.de/index.rss", region: dach, gewicht: 2}
  - {name: "heise",                 url: "https://www.heise.de/rss/heise-atom.xml", region: global, gewicht: 2}
  - {name: "Euractiv Economy",      url: "https://www.euractiv.com/sections/economy-jobs/feed/", region: eu, gewicht: 2}
  - {name: "ECB Press",             url: "https://www.ecb.europa.eu/rss/press.html", region: eu, gewicht: 3}
  - {name: "Reuters Business",      url: "https://news.google.com/rss/search?q=when:24h+allinurl:reuters.com&hl=en-US&gl=US&ceid=US:en", region: us, gewicht: 2}
  - {name: "Hacker News Top",       url: "https://hnrss.org/frontpage?points=200", region: global, gewicht: 1}
  - {name: "arXiv q-fin",           url: "http://export.arxiv.org/rss/q-fin", region: global, gewicht: 1}
  # Substacks — qualitativ das Beste am ganzen Feed-Set:
  - {name: "Doomberg",              url: "https://doomberg.substack.com/feed", region: global, gewicht: 3}
  - {name: "Apricitas",             url: "https://www.apricitas.io/feed", region: us, gewicht: 3}
  - {name: "Money Stuff",           url: "https://www.bloomberg.com/opinion/authors/ARbTQlRLRjE/matthew-s-levine.rss", region: us, gewicht: 2}

# --- Regime-Anzeigen -------------------------------------------------
# Jede Komponente wird als Perzentil gegen das Rueckblickfenster
# gerechnet und dann gemittelt. invert=true dreht die Richtung um.
rueckblick_jahre: 5

regime:
  zinsdruck:
    us:  [{fred: DGS10}, {fred: DFII10}, {fred: T10Y2Y, invert: true}]
    eur: [{ecb: "YC.B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y"}]
  wachstum:
    us:  [{fred: ICSA, invert: true}, {fred: SAHMREALTIME, invert: true}]
    eur: [{fred: CCUSMA02EZM618N}]
  energie:
    us:  [{yf: "CL=F"}, {yf: "NG=F"}]
    eur: [{yf: "TTF=F"}, {yf: "BZ=F"}]
  risikoappetit:
    glob: [{fred: BAMLH0A0HYM2, invert: true}, {yf: "^VIX", invert: true}]
  liquiditaet:
    us:  [{fred: WALCL}, {fred: RRPONTSYD, invert: true}, {fred: WTREGEN, invert: true}]
    eur: [{fred: ECBASSETSW}]
  geopolitik:
    glob: [{yf: "GC=F"}]     # Platzhalter; GPR-Index laesst sich hier eintragen

# --- Fest terminierte Ereignisse -------------------------------------
# Alles, was FRED nicht kennt. Einmal im Quartal nachtragen.
termine:
  - {datum: "2026-09-10", zeit: "14:15", region: eu,   was: "EZB-Zinsentscheid",      konsens: "keine Aenderung", wucht: hoch}
  - {datum: "2026-09-16", zeit: "20:00", region: us,   was: "Fed-Zinsentscheid",      konsens: "-25 Bp",          wucht: hoch}
  - {datum: "2026-09-25", zeit: "10:00", region: dach, was: "ifo-Geschaeftsklima",    konsens: "",                wucht: mittel}
  - {datum: "2026-10-05", zeit: "13:00", region: global, was: "OPEC+ Ministertreffen", konsens: "offen",          wucht: hoch}

# --- Reddit ----------------------------------------------------------
subreddits: [wallstreetbets, stocks, investing, economics, mauerstrassenwetten, SecurityAnalysis, europeanstocks]

# --- Leerverkaufsregister --------------------------------------------
# Diese Adressen aendern sich gelegentlich. Wenn ein Scraper leer
# zurueckkommt, steht die Ursache im Actions-Log.
register:
  fca: "https://www.fca.org.uk/publication/data/short-positions-daily-update.xlsx"
  afm: "https://www.afm.nl/nl-nl/sector/registers/meldingenregisters/netto-shortposities-actueel"
  bundesanzeiger: "https://www.bundesanzeiger.de/pub/de/nlp"

# --- Alarmschwellen --------------------------------------------------
# Bewusst hoch angesetzt. Lieber zu wenige Alarme als einer zu viel.
alarme:
  regime_sprung: 10          # Punkte an einem Tag
  neue_shortposition: true   # nur fuer Werte der Watchlist
  matrix_kippt: true         # Konsens wird zu Divergenz

# --- Sprachmodell ----------------------------------------------------
# anbieter: groq | gemini | openrouter | anthropic | keiner
# "keiner" laesst das Dashboard ohne Verdichtung und Wirkungsketten
# laufen — alles andere funktioniert unveraendert weiter.
llm:
  anbieter: groq
  modell: "llama-3.3-70b-versatile"
  max_ketten: 2
  max_profile: 8
