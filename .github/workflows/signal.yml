name: signal

on:
  schedule:
    - cron: "30 4 * * 1-5"
    - cron: "0 7,10,13,16,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Sammeln und auswerten
        env:
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID:  ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_SECRET:     ${{ secrets.REDDIT_SECRET }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 4 * * 1-5" ]; then
            python src/run.py --brief
          else
            python src/run.py
          fi

      - name: Alte Schnappschuesse ausduennen
        run: |
          find docs/history -name 'shorts-*.json' -mtime +120 \
            ! -name 'shorts-*-01.json' -delete 2>/dev/null || true

      - name: Ergebnis sichern
        run: |
          git config user.name  "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/history
          git diff --staged --quiet || git commit -m "Lauf $(date -u +%Y-%m-%dT%H:%M)"
          git push
